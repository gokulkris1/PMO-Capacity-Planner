services:
  # Retired legacy service. The application API is served by Netlify Functions.
  # This deployment intentionally exposes only /health and returns 410 for /api/*.
  - type: web
    name: pmo-capacity-planner-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: ./node_modules/.bin/tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /health
    # Keep the retired compatibility service from receiving automatic releases.
    autoDeploy: false
