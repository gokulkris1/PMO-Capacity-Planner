name: Netlify branch preview

# Deploys a non-main branch to a non-production alias on the existing Netlify site, but only after CI passed for
# that commit (PL-08#AC3):
#   https://<alias>--pmocapacityplanner.netlify.app
# Production deploys through Netlify's Git integration on main; this workflow never deploys with --prod.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias subdomain for the preview (lowercase, hyphens)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  preview:
    # Only for green CI runs of pushes to non-main branches (or a manual run, which repeats the gates below).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch != 'main' &&
       github.event.workflow_run.head_branch != 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repeat the gates for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: npm run ci

      - name: Build
        run: npm run build

      - name: No secrets in dist (HS-15)
        run: node scripts/check-dist-secrets.mjs

      - name: Derive alias from branch
        id: alias
        env:
          RAW_ALIAS: ${{ github.event.inputs.alias }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          raw="$RAW_ALIAS"
          if [ -z "$raw" ]; then raw="$BRANCH"; fi
          # Netlify aliases: lowercase alphanumerics and hyphens, keep it short
          alias=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#^-+##; s#-+$##' | cut -c1-37 | sed -E 's#-+$##')
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "Preview alias: $alias"

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are not set, so this branch cannot be deployed from Actions. Add them under Settings → Secrets and variables → Actions (token: Netlify → User settings → Applications → Personal access tokens; site id: Netlify → Project → Project configuration → General), or enable branch deploys for this branch in Netlify → Project configuration → Build & deploy → Branches and deploy contexts."
            exit 1
          fi

      - name: Deploy preview to Netlify
        uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426 # master @ 2025
        with:
          args: deploy --dir=dist --alias=${{ steps.alias.outputs.alias }} --site=${{ secrets.NETLIFY_SITE_ID }} --message="Preview of ${{ steps.alias.outputs.alias }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Preview URL
        id: url
        run: |
          url="https://${{ steps.alias.outputs.alias }}--pmocapacityplanner.netlify.app"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Netlify preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    # PL-08#AC4: the Playwright suite (package I) against the preview; the HTML report is kept as an artifact.
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the preview
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
