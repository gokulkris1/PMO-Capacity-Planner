[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22: global WebSocket for the Neon transaction pool, matches CI (PL-08).
  NODE_VERSION = "22"

[dev]
  command = "npm run dev:vite"
  targetPort = 3000

[functions]
  node_bundler = "esbuild"

# Scheduled functions run on published deploys only (A-11). Times are UTC.
[functions."jira-sync-scheduler"]
  schedule = "0 5 * * *"

[functions."jira-sync-worker"]
  schedule = "*/10 * * * *"

# Route /api/* to the catch-all Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (HS-12). The CSP ships as Report-Only first (HS-12#AC2); package I switches the header name to
# `Content-Security-Policy` once the e2e suite runs on a preview without CSP violations.
# Release 3.0 (embedded Jira routes) will need `frame-ancestors 'self' https://*.atlassian.net` on those routes only.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
